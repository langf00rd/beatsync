<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;"
    />
    <title>BeatSync</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- auth view -->
    <main id="auth-view" class="view">
      <div class="auth-card">
        <div class="brand">
          <div class="brand-mark">BS</div>
          <h1>BeatSync</h1>
          <p class="tagline">your scripts, backed up to the cloud.</p>
        </div>

        <div class="tabs">
          <button class="tab active" data-tab="signin">sign in</button>
          <button class="tab" data-tab="signup">create account</button>
        </div>

        <form id="auth-form">
          <label class="field">
            <span>email</span>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="you@example.com"
              required
              autocomplete="email"
            />
          </label>
          <label class="field">
            <span>password</span>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="at least 6 characters"
              required
              autocomplete="current-password"
            />
          </label>
          <p id="auth-error" class="error hidden"></p>
          <button type="submit" id="auth-submit" class="btn primary">
            sign in
          </button>
        </form>
      </div>
    </main>

    <!-- main view -->
    <main id="main-view" class="view hidden">
      <header class="topbar">
        <div class="brand small">
          <div class="brand-mark">BS</div>
          <span>beatsync</span>
        </div>
        <div class="topbar-right">
          <span id="user-email" class="user-email"></span>
          <button id="sign-out" class="btn ghost">sign out</button>
        </div>
      </header>

      <section class="panel">
        <div class="panel-head">
          <h2>sync folder</h2>
          <div class="status" id="status" data-state="idle">
            <span class="dot"></span>
            <span id="status-text">not watching</span>
          </div>
        </div>

        <div class="dir-row">
          <input
            type="text"
            id="dir-input"
            placeholder="choose a folder…"
            readonly
          />
          <button id="choose-dir" class="btn secondary">choose folder</button>
          <button id="start-sync" class="btn primary">start watching</button>
          <button id="stop-sync" class="btn danger hidden">stop</button>
        </div>

        <details class="advanced">
          <summary>advanced — file types to watch</summary>
          <div class="ext-row">
            <input
              type="text"
              id="extensions-input"
              placeholder=".fountain,.txt"
              value=".fountain"
            />
            <span class="hint">comma-separated extensions</span>
          </div>
        </details>

        <div class="log-box" id="log-box"></div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>files in the cloud</h2>
          <button id="refresh-files" class="btn ghost small">refresh</button>
        </div>
        <p id="files-empty" class="empty hidden">
          no files yet. pick a folder and start watching — changes will appear
          here.
        </p>
        <table class="files" id="files-table">
          <thead>
            <tr>
              <th>file</th>
              <th>last synced</th>
              <th>size</th>
            </tr>
          </thead>
          <tbody id="files-body"></tbody>
        </table>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
