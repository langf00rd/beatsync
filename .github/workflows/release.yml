name: release beatsync
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      
      - run: npm ci
      
      - run: npm run build:mac
      
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg